name: Bug report
description: Describe a reproducible problem with evidence.
labels: [bug]
body:
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
      description: Include the affected page and the result you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and evidence
      description: Browser, deployment method, screenshots or sanitized logs.
